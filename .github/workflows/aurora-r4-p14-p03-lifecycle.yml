# SPDX-License-Identifier: GPL-3.0-or-later
# New stacked checkpoint on immutable P14-P01/P02; no physical-device actions.
name: Aurora R4 P14 P03 — Hosted Download Update and Installer Decline
on:
  push:
    branches:
      - feature/aurora-r4-p14-p03-hosted-lifecycle-20261115
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurora-p14p03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Immutable P14 baseline, policy cases and P15 deferral
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Source pinned exact-SHA and negative checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/ci/r4_p14_p03_emulator_acceptance.sh
          python3 -B scripts/ci/test_r4_p14_p03_source_contract.py
          python3 -B scripts/ci/r4_p14_p03_source_contract.py --root .
          git diff --check 6e9418baaefadd4afcf4320b4a4b193546e66ec7 HEAD
  api36:
    name: 76 real Room, worker and Compose tests, 20 screenshots
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fail-closed evidence initialization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aurora-r4-p14-p03"
          printf '%s\n' '{"result":"NOT_RUN","real_installer_qualified":false,"physical_arm64_qualified":false,"release_qualified":false}' > "$RUNNER_TEMP/aurora-r4-p14-p03/receipt.json"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Provision GitHub SDK and emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-37.0'
          test -s "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          for attempt in 1 2 3 4; do
            if sdkmanager --install 'system-images;android-36;google_apis;x86_64'; then break; fi
            if [[ "$attempt" -eq 4 ]]; then exit 1; fi
            rm -rf -- "$ANDROID_SDK_ROOT/.temp" "$ANDROID_SDK_ROOT/system-images/android-36/google_apis/x86_64" "$HOME/.android/cache"
            sleep "$((attempt*10))"
          done
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Compile APK and instrumentation on GitHub only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          chmod +x gradlew
          # Fail closed: retry only a known transient AGP plugin repository lookup.
          # Compilation, Kotlin, resource, manifest and unrelated failures stop now.
          build_ok=false
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/aurora-r4-p14-p03/gradle-attempt-${attempt}.log"
            if ./gradlew --no-daemon --max-workers=2 --stacktrace \
                :app:assembleVanillaDebug :app:assembleVanillaDebugAndroidTest 2>&1 | tee "$log"; then
              build_ok=true
              break
            fi
            if ! grep -Fq "Plugin [id: 'com.android.application', version: '9.4.1', apply: false] was not found" "$log"; then
              echo P14P03_NON_TRANSIENT_GRADLE_FAILURE >&2
              exit 1
            fi
            if [[ "$attempt" == 3 ]]; then
              echo P14P03_AGP_UNAVAILABLE_AFTER_BOUNDED_RETRIES >&2
              exit 1
            fi
            echo "P14P03_AGP_RESOLUTION_RETRY attempt=$attempt" >&2
            sleep "$((attempt * 10))"
          done
          [[ "$build_ok" == true ]] || exit 1
      - name: Require disposable KVM-backed emulator
        shell: bash
        run: |
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run real hosted lifecycle, UI, decline policy, recovery and worker journeys
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/ci/r4_p14_p03_emulator_acceptance.sh
      - name: Preserve exact-SHA evidence, logs and screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: aurora-r4-p14-p03-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aurora-r4-p14-p03/
          if-no-files-found: error
          retention-days: 14
