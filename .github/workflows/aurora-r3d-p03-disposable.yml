      authorization:
        description: 'Only the feature branch can run disposable OS installation tests'
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - I_AUTHORIZE_DISPOSABLE_API36_EMULATOR_INSTALLS

permissions: {}

jobs:
  registration-only:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'This master workflow is inert; dispatch the feature ref.'
