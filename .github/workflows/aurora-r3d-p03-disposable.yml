# SPDX-License-Identifier: GPL-3.0-or-later
# Manual P03 real Android OS test. NEVER runs on push or pull_request.
name: Aurora R3D P03 — Disposable API36 Install Acceptance

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Opt in to live installs ONLY of new disposable signed test APKs on a clean hosted API36 emulator'
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - I_AUTHORIZE_DISPOSABLE_API36_EMULATOR_INSTALLS

permissions:
  contents: read

concurrency:
  group: aurora-r3d-p03-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: P03 offline and source-bound security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Source, opt-in, and disposable-fixture negative tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/ci/test_r3d_p01_p02_source.py
          python3 -B scripts/ci/test_r3d_p03_source.py
          echo 'R3D_P03_OFFLINE_SOURCE_CONTRACT_PASS_NO_DEVICE_INSTALL'

  actual-disposable-install:
    name: P03 actual clean API36 disposable installs (opt-in only)
    needs: contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization == 'I_AUTHORIZE_DISPOSABLE_API36_EMULATOR_INSTALLS' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install Android API36 platform, build tools and ephemeral emulator image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test '${{ inputs.authorization }}' = I_AUTHORIZE_DISPOSABLE_API36_EMULATOR_INSTALLS
          sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'system-images;android-36;google_apis;x86_64'
      - name: Build three independently signed and checked disposable APKs (ephemeral private test keys)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/ci/r3d_p03_fixture.py build --out "$RUNNER_TEMP/r3d-p03-fixtures"
          python3 -B scripts/ci/r3d_p03_fixture.py verify --dir "$RUNNER_TEMP/r3d-p03-fixtures"
      - name: Require KVM for clean ephemeral test-only emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run real v1→v2→v1 and OS rejection/cancellation/data preservation tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: >-
            python3 -B scripts/ci/r3d_p03_disposable.py run
            --fixture-dir "$RUNNER_TEMP/r3d-p03-fixtures"
            --sha "$GITHUB_SHA"
            --run-id "$GITHUB_RUN_ID"
            --serial emulator-5554
            --authorize I_AUTHORIZE_DISPOSABLE_API36_EMULATOR_INSTALLS
            --report "$RUNNER_TEMP/R3D_P03_ACTUAL_DISPOSABLE_RECEIPT.json"
      - name: Upload OS result only; success cannot imply real user app data or Aurora UI qualification
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: aurora-r3d-p03-disposable-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/R3D_P03_ACTUAL_DISPOSABLE_RECEIPT.json
            ${{ runner.temp }}/r3d-p03-fixtures/fixtures.json
          if-no-files-found: warn
          retention-days: 14
