# SPDX-License-Identifier: GPL-3.0-or-later
# P13-B is a NEW additive checkpoint. P12 SHA, tests and workflow are frozen.
name: Aurora R4 P13-B — Nav3 Multi-Size Visual Qualification
on:
  push:
    branches:
      - feature/aurora-consolidated-integration-20261125
      - feature/aurora-r4-p13b-nav3-multisize-20261114
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurora-p13b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: P13-B immutable P12 baseline and offline source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate additive changes, negative mutations, real Nav3 and P12 pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/ci/r4_p13b_emulator_acceptance.sh
          python3 -B scripts/ci/test_r4_p13b_source_contract.py
          python3 -B scripts/ci/test_r4_p13b_visual_signoff.py
          python3 -B scripts/ci/r4_p13b_source_contract.py --root . --integration
          python3 -B scripts/ci/test_r4_p06_screenshot_audit.py
          git diff --check 3ea10b6f4b0fed5a8913e4edef3536cfc93fc52f HEAD
  real-api36-p13b:
    name: 20 real tests and 48 screenshots, Nav3 and two sizes
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create fail-closed receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aurora-r4-p13b"
          printf '%s\n' '{"result":"NOT_RUN","manual_visual_approved":false,"full_upstream_visual_signoff":false,"release_qualified":false}' > "$RUNNER_TEMP/aurora-r4-p13b/receipt.json"
          cp docs/r4/R4_P13B_UPSTREAM_PR113_REFERENCES.json "$RUNNER_TEMP/aurora-r4-p13b/upstream-pr113-references.json"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install required GitHub SDK and API36 system image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-37.0'
          test -s "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          for attempt in 1 2 3 4; do
            if sdkmanager --install 'system-images;android-36;google_apis;x86_64'; then break; fi
            if [[ "$attempt" -eq 4 ]]; then exit 1; fi
            rm -rf -- "$ANDROID_SDK_ROOT/.temp" "$ANDROID_SDK_ROOT/system-images/android-36/google_apis/x86_64" "$HOME/.android/cache"
            sleep "$((attempt*10))"
          done
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Compile source-pinned app and instrumentation APK on GitHub only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --stacktrace \
            :app:assembleVanillaDebug :app:assembleVanillaDebugAndroidTest
      - name: Require KVM-backed disposable emulator
        shell: bash
        run: |
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run real API36 Navigation3 and integrated journeys with 48 screenshots
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/ci/r4_p13b_emulator_acceptance.sh
      - name: Publish source-bound receipt, screenshots and all logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: aurora-r4-p13b-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aurora-r4-p13b/
          if-no-files-found: error
          retention-days: 14
